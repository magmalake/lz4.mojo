[workspace]
authors = ["Marius S <39998+winding-lines@users.noreply.github.com>"]
name = "lz4.mojo"
version = "0.1.1"
description = "A Mojo lz4 binding (block format and frame format, compress/decompress) via FFI to liblz4. Block format (LZ4_RAW) is a Parquet codec; frame format is the only codec Apache Iceberg allows in Puffin file footers."
preview = ["pixi-build"]
channels = [
    "https://conda.modular.com/max-nightly",
    "conda-forge",
]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[dependencies]
lz4-c = ">=1.9,<2"
# The FFI shim is a pixi package (shim/); pixi builds it and installs
# lib/liblz4mojo.{dylib,so} into the env — no manual build step.
lz4-shim = { path = "shim" }
# Added by `pixi shelf add lint-mojo`: the linter comes from GitHub as a pixi
# source dependency pinned at the revision mojoshelf published, and builds
# the `mojolint` executable into every environment next to mojo-lsp-server.
lint-mojo = { git = "https://github.com/magmalake/lint.mojo.git", rev = "5682b29cedd8d7cd768543ef26ab930732232b79" }

[tasks]
# Round-trip gate: block + frame compress -> decompress -> original, plus
# known-vector and corruption checks. The shim is dlopened at runtime from
# $CONDA_PREFIX/lib, installed by the lz4-shim package.
test = { cmd = "mkdir -p build && mojo build test/lz4_test.mojo -I src -o build/lz4-test && ./build/lz4-test" }
# mojolint (lint-mojo, below): the origin and threading mistakes the compiler
# lets through, with mojo-lsp-server behind the rules. Exit 1 on findings.
lint = { cmd = "mojolint --lsp -I src src test" }

[feature.nightly.dependencies]
modular = ">=26.7.0.dev2026092005,<28"

[feature.stable.dependencies]
mojo-compiler = "==1.1.0"

# Benchmarks run through the shared harness (magmalake/bench.mojo) and get
# their own feature, so the tin stays out of the environments that run tests.
# -I $CONDA_PREFIX/lib/mojo is what puts its precompiled package on the import
# path. Stable only: a precompiled Mojo package is stamped with the compiler
# version that built it and refused by any other, and tins build with 1.1.0.
[feature.bench.dependencies]
bench-mojo = { git = "https://github.com/magmalake/bench.mojo", rev = "e12117679ea7d55c16a7250958340fa096e49eed" }

[feature.bench.tasks]
bench = "mkdir -p build && mojo build -I src -I $CONDA_PREFIX/lib/mojo bench/bench_lz4.mojo -o build/bench-lz4 && ./build/bench-lz4"
# bench/ imports the shared harness by source path (mojolint needs real
# sources to resolve, not the precompiled package bench-mojo installs above).
lint-bench = { cmd = "mojolint --lsp -I src -I ../bench.mojo/src bench" }

[environments]
default = ["nightly"]
stable = ["stable"]
bench = ["stable", "bench"]

# ── pixi-build: consumable as a pixi source dependency ──────────────────────
# Conda package name is lz4-mojo (conda-forge owns "lz4"/"lz4-c"); the Mojo
# import stays `from lz4 import …`.
[package]
name = "lz4-mojo"
version = "0.1.1"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }

[package.build.config.pkg]
path = "src/lz4"
name = "lz4"

[package.host-dependencies]
mojo-compiler = "==1.1.0"

[package.build-dependencies]
mojo-compiler = "==1.1.0"

[package.run-dependencies]
mojo-compiler = ">=1.1.0,<2"
lz4-shim = { path = "shim" }
