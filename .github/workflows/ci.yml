name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.env == 'default' && 'nightly' || matrix.env }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        env: [default, stable]
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          # Pinned: the committed lock file is written by 0.78.0, and an
          # unpinned pixi rejects it as not up-to-date with the workspace.
          pixi-version: v0.78.0
          environments: ${{ matrix.env }}

      - name: Unit tests
        run: pixi run -e ${{ matrix.env }} test

      - name: Lint (mojolint --lsp)
        run: pixi run -e ${{ matrix.env }} lint

  lint-bench:
    # bench/ imports the shared harness (magmalake/bench.mojo) by source
    # path, so linting it needs that repo checked out next door — unlike the
    # `test` job above, this one lays both repos out under named paths.
    name: lint bench / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: lz4.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/bench.mojo
          path: bench.mojo

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          manifest-path: lz4.mojo/pixi.toml
          environments: bench

      - name: Lint bench (mojolint --lsp)
        working-directory: lz4.mojo
        run: pixi run -e bench lint-bench
